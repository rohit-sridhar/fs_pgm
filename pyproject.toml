[build-system]
requires = ["nanobind>=2.4.0", "setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm"
version = "0.1.0"
dependencies = ["numpy>=2.0.0,<3.0.0"] # Add your project dependencies here if needed

[project.scripts]
run-pgm = "main:main"  # Format is: command_name = "file_name:function_name"

[tool.setuptools.packages.find]
where = ["."]       # Search in the repository root
include = ["pgm*"]   # ONLY include the 'pgm' package, ignoring everything else
# namespaces = false   # ignore namespace logic


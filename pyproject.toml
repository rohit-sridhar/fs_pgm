[build-system]
requires = ["nanobind>=2.4.0", "setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm"
version = "0.1.0"
dependencies = ["numpy>=2.0.0,<3.0.0", "matplotlib>=3.10.0", "scipy>=1.13.0"]

[project.scripts]
run-pgm = "main:main"

[tool.setuptools]
# Map root modules ("") to 'src', but keep Python packages resolving normally
package-dir = { "" = "src", "pgm" = "pgm" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]       # Search in the repository root
include = ["pgm*"]   # ONLY include the 'pgm' package, ignoring everything else

